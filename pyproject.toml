[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "exe-auth-ctrl-loop"
version = "0.2.0"
description = "Cross-model execution-authority control loop: OpenAI proposes, Claude requests, a deterministic host-owned controller authorizes, and a gateway executes."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
authors = [{ name = "Jason Edward Plumb" }]
keywords = [
    "access-control",
    "agents",
    "ai-safety",
    "anthropic",
    "authorization",
    "capability",
    "claude",
    "human-in-the-loop",
    "llm",
    "openai",
    "safety",
    "tool-use",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = [
    "anthropic",
    "jsonschema>=4",
    "openai",
    "pydantic>=2",
]

[project.optional-dependencies]
dev = [
    "mypy",
    "pytest",
    "ruff",
    "types-jsonschema",
]

[project.urls]
Repository = "https://github.com/jasoneplumb/exe-auth-ctrl-loop"

[tool.hatch.build.targets.wheel]
packages = ["src/exe_auth_ctrl_loop"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
strict_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
